# Build and validate the static site before publishing a pull-request preview.
name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Validate Lab content
        run: npm run validate:lab
      - name: Lint
        run: npm run lint
      - name: Build static site
        run: npm run build
      - name: Validate exported Lab routes
        run: npm run validate:lab:build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LUKEPAYNE }}
          projectId: lukepayne
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
